name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['18', '20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check the CLI starts and reads the demo album
        run: |
          node bin/music-player.js --version
          node bin/music-player.js --list
          node bin/music-player.js --doctor || true

      - name: Re-render one demo track to prove generation is reproducible
        run: node scripts/generate-songs.js --only night-drive --out ./tmp-songs
